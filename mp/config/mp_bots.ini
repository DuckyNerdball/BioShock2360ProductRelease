# Auto bots for private matches (bioshock2mp). Re-read every 2 s; count/delay apply at the next match start.
enabled=1
count=7
delay=3
gap=0.6
cmd=admin DebugAddAIBot
# Bot aim fix: point each bot's view at its current target every frame. aimerror = random error in degrees
# (0 = aimbot, 3 = decent, 8 = sloppy); aimz = aim height above target origin; aimoffs = bot fields holding the target.
aimfix=1
aimerror=3
aimz=20
# aimmiss = aim error in UNITS at the target (pawn is ~25 wide; 10 = most shots land, 30 = sloppy), capped at aimerror deg.
# aimeye = bot eye height used until the game reports it (EYE lines in mp_spawn.log).
aimmiss=10
aimeye=0
aimoffs=494,4B0,5A0,A58
# Lobby "Match starting in N" clamp (experimental, finds the countdown field itself): 0 = off
countdown=5
# Prey research log (PREYREFS lines)
preyscan=0
# Force every bot onto you: preyoff=494 + preyforce=1 (your pawn) - try after aimfix
preyoff=0
preyforce=0
# Hunters: the first N bots always target YOU (aim + chase). 0 = off, all = every bot. Live-editable.
hunters=0
huntoffs=494,4B0,5A0,A58
# Stack probe: log the host call stack (which native sub_82XXXXXX raised it) for these script events, 3 per class.
stackfns=
# research=1 turns on call-tree bursts, object dumps, prey scans, stack probes (heavy: causes stutter). 0 = play mode.
research=0
# Let bot guns do damage (bypass the local-player check in the weapon damage native sub_827275D0). 0 = off.
botdamage=1
# Spawn spread: bots (re)spawn at the PlayerStart farthest from everyone (random among the best 3 that are
# at least spreadmin units from any pawn). 0 = game default (all bots on one spot).
spread=1
spreadmin=600
# Hunters respawn this far from you (units) so they find you fast; others spawn far away.
huntnear=1200
huntfar=3000
# Bot names, used in order (replaces "AI Bot N"). Empty = game default.
names=Lincoln,Washington,Roosevelt,Jefferson,Kennedy,Grant,Eisenhower,Truman,Adams,Madison,Monroe,Jackson,Polk,Coolidge,Taft
# unlockall=1: every rank needs 0 ADAM -> your profile ranks to max on your next kill (saved like a normal rank-up)
unlockall=1
# skipintro=1: apartment loads in free-roam (no TV film / guided steps)
skipintro=0
